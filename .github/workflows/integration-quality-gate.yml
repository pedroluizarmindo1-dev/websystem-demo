name: Integration quality gate
on:
  pull_request:
    branches:
      - release/client-build-2026-11-10
  push:
    branches:
      - integration/order-history-client-area-20261112
permissions:
  contents: read
jobs:
  isolated-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax validation
        run: |
          node --check api/server.mjs
          node --check api/client-area.mjs
          node --check api/commerce.mjs
      - name: Production build
        run: npm run build
      - name: Isolated order history
        run: node scripts/qa-order-history-isolated.mjs
      - name: Client isolation
        run: node scripts/qa-client-isolated.mjs
      - name: Customer sign-up and mail flows
        run: node scripts/qa-client-register-isolated.mjs
      - name: RBAC
        run: node scripts/qa-rbac-isolated.mjs
      - name: Security
        run: node scripts/qa-security-isolated.mjs
      - name: Admin operations CSRF and Origin regression
        run: node scripts/qa-admin-ops-security-gate.mjs
      - name: Admin operations
        run: node scripts/qa-admin-ops-isolated.mjs
      - name: Admin operations UI (headless Chrome)
        run: node scripts/qa-admin-ops-ui.mjs
      - name: Public home page UI (headless Chrome)
        run: node scripts/qa-home-ui.mjs
      - name: Client area UI (headless Chrome)
        run: node scripts/qa-client-area-ui.mjs
      - name: Public layout audit (headless Chrome)
        run: node scripts/qa-layout-audit.mjs
      - name: PIX top-ups (MazzoPay simulator, no real money)
        run: node scripts/qa-mazzopay-isolated.mjs
      - name: Pay order drafts with the wallet (fictitious data)
        run: node scripts/qa-checkout-isolated.mjs
      - name: Supervised supplier submission (DHRU simulator, no real orders)
        run: node scripts/qa-supplier-orders-isolated.mjs
      - name: robots.txt, sitemap and canonical host
        run: node scripts/qa-seo-isolated.mjs
      - name: Smoke
        run: node scripts/qa-smoke.mjs
      - name: Pricing
        run: node scripts/qa-pricing.mjs
      - name: Client IP behind a reverse proxy
        run: node scripts/qa-proxy-trust-isolated.mjs
      - name: DHRU reseller API balance isolation and idempotency
        run: node scripts/qa-dhru-idempotency.mjs
      - name: Dismiss production deploy outside the release ref
        run: node scripts/qa-production-release-gates.mjs
