name: WebSystem SSH connectivity check
on:
  push:
    branches: [release/client-build-2026-11-10]
    paths: ['.github/workflows/ssh-connectivity.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate configured secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for key in VPS_HOST VPS_USER VPS_SSH_KEY VPS_SSH_KNOWN_HOSTS; do
            test -n "${!key}" || { echo "::error::Missing $key"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
      - name: Read-only Hostinger SSH probe
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=12 -o ConnectionAttempts=2 "$VPS_USER@$VPS_HOST" 'printf "SSH_AUTH_OK\n"; hostname; test -d /opt/websystem && echo APP_DIR_OK'
