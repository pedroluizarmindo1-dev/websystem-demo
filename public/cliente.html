<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Área do Cliente | WebSystem</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark}body{margin:0;background:#090909;color:#f5f5f5}main{max-width:820px;margin:auto;padding:32px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:clamp(25px,5vw,36px)}h2{font-size:20px}section{background:#181818;border:1px solid #353535;border-radius:16px;padding:20px;margin:20px 0}input,textarea,button{font:inherit;border-radius:9px;padding:12px;box-sizing:border-box}input,textarea{width:100%;margin:8px 0 14px;background:#090909;color:white;border:1px solid #555555}button{background:#f5f5f5;color:#111111;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.5}a{color:#f5f5f5}.muted{color:#aaaaaa}article{padding:12px 0;border-bottom:1px solid #353535}label{display:block}#msg{min-height:24px;color:#ffd18c}</style></head><body><main><header><strong>WebSystem UNLOCKER Tools</strong><a href="/">Voltar ao site</a></header><h1>Área do Cliente</h1><p class="muted">Acompanhe pedidos e abra chamados de suporte.</p><p id="msg" role="status" aria-live="polite"></p><section id="loginBox"><h2>Entrar</h2><form id="login"><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form><p class="muted">O acesso é criado pela equipe de atendimento. Não há cadastro público nesta versão.</p></section><div id="dashboard" hidden><section><header><h2 id="greeting">Minha conta</h2><button id="logout">Sair</button></header></section><section><h2>Meus pedidos</h2><div id="orders">Carregando…</div></section><section><h2>Suporte</h2><form id="ticket"><label>Assunto<input name="subject" maxlength="160" required></label><label>Descrição<textarea name="description" rows="4" maxlength="4000" required></textarea></label><button>Abrir chamado</button></form><h2>Meus chamados</h2><div id="tickets">Carregando…</div></section></div></main><script>
const $=id=>document.getElementById(id),msg=s=>$('msg').textContent=s;
async function api(path,opts={}){const r=await fetch('/api/client'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opts});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Erro '+r.status);return data}
const el=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
function renderList(id,items,render){const root=$(id);root.replaceChildren();if(!items.length){root.append(el('p','Nenhum registro encontrado.'));return}items.forEach(item=>{const a=el('article','');render(a,item);root.append(a)})}
async function refresh(){const u=await api('/me');$('loginBox').hidden=true;$('dashboard').hidden=false;$('greeting').textContent='Olá, '+u.display_name;const [orders,tickets]=await Promise.all([api('/orders'),api('/tickets')]);renderList('orders',orders,(a,o)=>{a.append(el('strong','#'+o.id+' — '+o.device_model));a.append(el('p','Status: '+o.status+' · Pagamento: '+o.payment_status))});renderList('tickets',tickets,(a,t)=>{a.append(el('strong','#'+t.id+' — '+t.subject));a.append(el('p','Status: '+t.status));if(t.resolution)a.append(el('p',t.resolution))})}
$('login').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api('/login',{method:'POST',body:JSON.stringify(d)});e.target.reset();msg('');await refresh()}catch(err){msg(err.message)}});
$('logout').addEventListener('click',async()=>{try{await api('/logout',{method:'POST'});}catch{}$('dashboard').hidden=true;$('loginBox').hidden=false;msg('Sessão encerrada.')});
$('ticket').addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api('/tickets',{method:'POST',body:JSON.stringify(d)});e.target.reset();msg('Chamado criado.');await refresh()}catch(err){msg(err.message)}});
refresh().catch(()=>{});
</script></body></html>
